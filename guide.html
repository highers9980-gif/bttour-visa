<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#059669">
  <title>BT TOUR - Phieu chi dan huong dan vien</title>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BT TOUR">
  <meta property="og:title" content="BT TOUR - Phieu chi dan huong dan vien">
  <meta property="og:description" content="Lich trinh, khach san, xe va lien he khan cap cho huong dan vien.">
  <meta property="og:locale" content="vi_VN">
  <meta name="description" content="Lich trinh, khach san, xe va lien he khan cap cho huong dan vien.">
  <meta name="robots" content="noindex, nofollow">

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #f7faf9;
      --surface: #ffffff;
      --surface-alt: #eef7f3;
      --ink: #17211d;
      --muted: #66736e;
      --line: #d9e3df;
      --primary: #07865f;
      --primary-strong: #05684d;
      --cyan: #087f95;
      --yellow: #b7791f;
      --red: #c2413a;
      --green-soft: #dff5eb;
      --cyan-soft: #dcf3f7;
      --yellow-soft: #fff4d7;
      --red-soft: #fde7e5;
      --shadow: 0 10px 30px rgba(15, 37, 29, 0.08);
      --radius: 8px;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.45;
      -webkit-text-size-adjust: 100%;
    }

    button { cursor: pointer; font: inherit; }
    a { color: var(--primary-strong); }
    [hidden] { display: none !important; }

    .wrap {
      margin: 0 auto;
      max-width: 720px;
      padding: 16px 16px 96px;
    }

    /* ---------- header ---------- */

    .sheet-head {
      background: linear-gradient(145deg, #07865f 0%, #05684d 100%);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      color: #fff;
      padding: 18px;
    }

    .sheet-brand {
      align-items: center;
      display: flex;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      opacity: 0.86;
      text-transform: uppercase;
    }

    .sheet-title {
      font-size: 21px;
      font-weight: 780;
      line-height: 1.25;
      margin: 8px 0 0;
    }

    .sheet-sub {
      font-size: 14px;
      margin: 6px 0 0;
      opacity: 0.9;
    }

    .sheet-meta {
      border-top: 1px solid rgba(255, 255, 255, 0.24);
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      font-size: 12px;
      margin-top: 14px;
      opacity: 0.82;
      padding-top: 10px;
    }

    /* ---------- cards ---------- */

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin-top: 14px;
      overflow: hidden;
    }

    .card-head {
      align-items: center;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 8px;
      font-size: 13px;
      font-weight: 720;
      padding: 10px 14px;
    }

    .card-body { padding: 14px; }

    .rows { display: grid; gap: 10px; }

    .row {
      align-items: baseline;
      display: grid;
      gap: 4px 12px;
      grid-template-columns: 104px 1fr;
    }

    .row dt {
      color: var(--muted);
      font-size: 13px;
    }

    .row dd {
      font-size: 15px;
      font-weight: 600;
      margin: 0;
      word-break: break-word;
    }

    @media (max-width: 380px) {
      .row { grid-template-columns: 1fr; }
    }

    /* ---------- timeline ---------- */

    .day + .day { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 14px; }

    .day-head {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .day-badge {
      background: var(--primary);
      border-radius: 999px;
      color: #fff;
      font-size: 12px;
      font-weight: 720;
      padding: 3px 10px;
    }

    .day-date { color: var(--muted); font-size: 13px; }

    .stops { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }

    .stop {
      border-left: 2px solid var(--line);
      padding: 0 0 14px 14px;
      position: relative;
    }

    .stop:last-child { border-left-color: transparent; padding-bottom: 0; }

    .stop::before {
      background: var(--surface);
      border: 2px solid var(--primary);
      border-radius: 50%;
      content: "";
      height: 9px;
      left: -5.5px;
      position: absolute;
      top: 5px;
      width: 9px;
    }

    .stop-time {
      color: var(--primary-strong);
      font-size: 13px;
      font-weight: 720;
      font-variant-numeric: tabular-nums;
    }

    .stop-name { font-size: 15px; font-weight: 640; }

    .stop-note { color: var(--muted); font-size: 13px; margin-top: 2px; }

    /* ---------- contacts ---------- */

    .contacts { display: grid; gap: 8px; }

    .contact {
      align-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      display: flex;
      gap: 12px;
      padding: 10px 12px;
      text-decoration: none;
      color: inherit;
    }

    .contact:active { background: var(--surface-alt); }

    .contact-role { color: var(--muted); font-size: 12px; }
    .contact-name { font-size: 15px; font-weight: 640; }
    .contact-tel {
      color: var(--primary-strong);
      font-size: 14px;
      font-weight: 700;
      margin-left: auto;
      white-space: nowrap;
    }

    .urgent { background: var(--red-soft); border-color: #f2c7c3; }
    .urgent .contact-tel { color: var(--red); }

    /* ---------- notes ---------- */

    .notes { margin: 0; padding-left: 18px; }
    .notes li { margin-bottom: 6px; }
    .notes li:last-child { margin-bottom: 0; }

    .callout {
      background: var(--yellow-soft);
      border: 1px solid #ecd9a4;
      border-radius: var(--radius);
      font-size: 14px;
      padding: 12px 14px;
    }

    /* ---------- action bar ---------- */

    .actions {
      backdrop-filter: blur(8px);
      background: rgba(255, 255, 255, 0.94);
      border-top: 1px solid var(--line);
      bottom: 0;
      display: flex;
      gap: 8px;
      left: 0;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      position: fixed;
      right: 0;
      z-index: 20;
    }

    .actions-inner {
      display: flex;
      gap: 8px;
      margin: 0 auto;
      max-width: 720px;
      width: 100%;
    }

    .button {
      background: var(--primary);
      border: 1px solid var(--primary);
      border-radius: var(--radius);
      color: #fff;
      flex: 1;
      font-size: 15px;
      font-weight: 700;
      padding: 12px 14px;
    }

    .button.ghost {
      background: var(--surface);
      border-color: var(--line);
      color: var(--ink);
      flex: 0 0 auto;
    }

    .button[disabled] { opacity: 0.55; cursor: default; }

    .state {
      color: var(--muted);
      font-size: 14px;
      padding: 40px 16px;
      text-align: center;
    }

    .stamp {
      color: var(--muted);
      font-size: 12px;
      margin-top: 16px;
      text-align: center;
    }

    /* ---------- print / save as PDF ---------- */

    @media print {
      :root { --shadow: none; }
      body { background: #fff; }
      .wrap { max-width: none; padding: 0; }
      .actions { display: none !important; }
      .sheet-head {
        background: #fff !important;
        border: 1px solid var(--line);
        color: var(--ink) !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .sheet-meta { border-top-color: var(--line); opacity: 1; }
      .card { break-inside: avoid; page-break-inside: avoid; }
      .day { break-inside: avoid; page-break-inside: avoid; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div id="state" class="state">Dang tai phieu chi dan...</div>
    <div id="sheet" hidden></div>
    <p id="stamp" class="stamp" hidden></p>
  </main>

  <div class="actions" id="actions" hidden>
    <div class="actions-inner">
      <button class="button" id="btn-ack" type="button">Da xac nhan</button>
      <button class="button ghost" id="btn-save" type="button">Luu PDF</button>
    </div>
  </div>

  <script>
    'use strict';

    // ---------------------------------------------------------------
    // Data source, in priority order:
    //   ?id=<token>  -> fetch from API_BASE
    //   ?d=<base64>  -> itinerary inlined in the URL (no backend needed)
    //   neither      -> DEMO fallback so the page is previewable
    // ---------------------------------------------------------------

    var API_BASE = '';

    var DEMO = {
      tourName: 'Busan - Seoul 4N5D',
      teamCode: 'BT-2608-A',
      agency: 'Saigon Travel',
      pax: '30+1',
      startDate: '2026-08-18',
      endDate: '2026-08-22',
      version: 3,
      issuedAt: '2026-08-10T09:20:00+09:00',
      guide: { name: 'Nguyen Van A', tel: '+82-10-1234-5678' },
      driver: { name: 'Kim Min Su', tel: '+82-10-9876-5432', plate: '서울 70바 1234' },
      flights: {
        arrival: { code: 'VJ962', at: '2026-08-18 07:15', airport: 'PUS' },
        departure: { code: 'VJ961', at: '2026-08-22 09:40', airport: 'ICN' }
      },
      hotels: [
        { name: 'Layers Hotel Busan', nights: 1, tel: '+82-51-000-0000', address: 'Busanjin-gu, Busan' },
        { name: 'Bernoui Hotel Seoul', nights: 3, tel: '+82-2-000-0000', address: 'Jung-gu, Seoul' }
      ],
      days: [
        {
          date: '2026-08-18', label: 'Day 1',
          stops: [
            { time: '07:15', name: 'Don doan tai san bay Gimhae (PUS)', note: 'Bang ten BT TOUR, cua ra so 2' },
            { time: '09:00', name: 'Gamcheon Culture Village' },
            { time: '12:00', name: 'Trua', note: 'Nha hang dia phuong - 15,000 KRW/pax' },
            { time: '15:00', name: 'Haeundae Beach' },
            { time: '18:00', name: 'Toi + nhan phong Layers Hotel Busan' }
          ]
        },
        {
          date: '2026-08-19', label: 'Day 2',
          stops: [
            { time: '08:00', name: 'Khoi hanh di Seoul', note: 'Di chuyen ~4.5h, nghi giua duong 1 lan' },
            { time: '13:00', name: 'Trua tai Seoul' },
            { time: '15:00', name: 'Gyeongbokgung Palace' },
            { time: '18:30', name: 'Toi + nhan phong Bernoui Hotel Seoul' }
          ]
        }
      ],
      emergency: [
        { role: 'Dieu hanh BT TOUR', name: 'Truc 24h', tel: '+84-24-3850-5100', urgent: true },
        { role: 'Ho tro tai Han Quoc', name: 'Van phong Seoul', tel: '+82-2-000-1234' }
      ],
      notes: [
        'Xac nhan so luong khach truoc khi xe lan banh.',
        'Gui anh diem danh vao nhom Zalo sau moi diem tham quan.',
        'Shopping 2 lan theo hop dong - khong tu y them.'
      ]
    };

    var esc = function (v) {
      return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    };

    var telHref = function (tel) {
      return 'tel:' + String(tel || '').replace(/[^\d+]/g, '');
    };

    function decodeInline(raw) {
      var b64 = raw.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      var bin = atob(b64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return JSON.parse(new TextDecoder().decode(bytes));
    }

    function row(label, value) {
      if (!value) return '';
      return '<div class="row"><dt>' + esc(label) + '</dt><dd>' + esc(value) + '</dd></div>';
    }

    function card(title, inner) {
      if (!inner) return '';
      return '<section class="card"><div class="card-head">' + esc(title) + '</div>' +
        '<div class="card-body">' + inner + '</div></section>';
    }

    function renderHead(d) {
      var range = [d.startDate, d.endDate].filter(Boolean).join(' ~ ');
      var meta = [];
      if (d.teamCode) meta.push('Ma doan: ' + d.teamCode);
      if (d.pax) meta.push('Khach: ' + d.pax);
      if (d.agency) meta.push(d.agency);
      return '<header class="sheet-head">' +
        '<div class="sheet-brand">BT TOUR &middot; Phieu chi dan</div>' +
        '<h1 class="sheet-title">' + esc(d.tourName || 'Chuong trinh tour') + '</h1>' +
        (range ? '<p class="sheet-sub">' + esc(range) + '</p>' : '') +
        (meta.length ? '<div class="sheet-meta">' + meta.map(esc).join('<span>&middot;</span>') + '</div>' : '') +
        '</header>';
    }

    function renderTeam(d) {
      var inner = '<div class="rows">' +
        row('Huong dan vien', d.guide && d.guide.name) +
        row('Dien thoai HDV', d.guide && d.guide.tel) +
        row('Tai xe', d.driver && d.driver.name) +
        row('Dien thoai xe', d.driver && d.driver.tel) +
        row('Bien so xe', d.driver && d.driver.plate) +
        '</div>';
      return /<div class="row">/.test(inner) ? card('Doan & xe', inner) : '';
    }

    function renderFlights(d) {
      var f = d.flights || {};
      var fmt = function (leg) {
        if (!leg) return '';
        return [leg.code, leg.at, leg.airport].filter(Boolean).join(' / ');
      };
      var inner = '<div class="rows">' +
        row('Chuyen den', fmt(f.arrival)) +
        row('Chuyen di', fmt(f.departure)) +
        '</div>';
      return /<div class="row">/.test(inner) ? card('Chuyen bay', inner) : '';
    }

    function renderHotels(d) {
      var list = d.hotels || [];
      if (!list.length) return '';
      var inner = '<div class="rows">' + list.map(function (h) {
        var detail = [h.nights ? h.nights + ' dem' : '', h.address, h.tel].filter(Boolean).join(' / ');
        return '<div class="row"><dt>' + esc(h.name) + '</dt><dd>' + esc(detail) + '</dd></div>';
      }).join('') + '</div>';
      return card('Khach san', inner);
    }

    function renderDays(d) {
      var days = d.days || [];
      if (!days.length) return '';
      var inner = days.map(function (day) {
        var stops = (day.stops || []).map(function (s) {
          return '<li class="stop">' +
            (s.time ? '<div class="stop-time">' + esc(s.time) + '</div>' : '') +
            '<div class="stop-name">' + esc(s.name) + '</div>' +
            (s.note ? '<div class="stop-note">' + esc(s.note) + '</div>' : '') +
            '</li>';
        }).join('');
        return '<div class="day"><div class="day-head">' +
          '<span class="day-badge">' + esc(day.label || '') + '</span>' +
          (day.date ? '<span class="day-date">' + esc(day.date) + '</span>' : '') +
          '</div><ul class="stops">' + stops + '</ul></div>';
      }).join('');
      return card('Lich trinh', inner);
    }

    function renderEmergency(d) {
      var list = d.emergency || [];
      if (!list.length) return '';
      var inner = '<div class="contacts">' + list.map(function (c) {
        return '<a class="contact' + (c.urgent ? ' urgent' : '') + '" href="' + esc(telHref(c.tel)) + '">' +
          '<span><span class="contact-role">' + esc(c.role || '') + '</span><br>' +
          '<span class="contact-name">' + esc(c.name || '') + '</span></span>' +
          '<span class="contact-tel">' + esc(c.tel || '') + '</span></a>';
      }).join('') + '</div>';
      return card('Lien he khan cap', inner);
    }

    function renderNotes(d) {
      var list = d.notes || [];
      if (!list.length) return '';
      return card('Luu y', '<ul class="notes">' + list.map(function (n) {
        return '<li>' + esc(n) + '</li>';
      }).join('') + '</ul>');
    }

    function render(d) {
      document.getElementById('sheet').innerHTML =
        renderHead(d) + renderTeam(d) + renderFlights(d) +
        renderHotels(d) + renderDays(d) + renderEmergency(d) + renderNotes(d);

      if (d.tourName) document.title = 'BT TOUR - ' + d.tourName;

      var stampBits = [];
      if (d.version) stampBits.push('Ban ' + d.version);
      if (d.issuedAt) {
        var t = new Date(d.issuedAt);
        stampBits.push('Phat hanh ' + (isNaN(t) ? d.issuedAt : t.toLocaleString('vi-VN')));
      }
      var stamp = document.getElementById('stamp');
      if (stampBits.length) {
        stamp.textContent = stampBits.join(' · ') + ' · Luon mo link nay de xem ban moi nhat.';
        stamp.hidden = false;
      }

      document.getElementById('state').hidden = true;
      document.getElementById('sheet').hidden = false;
      document.getElementById('actions').hidden = false;
    }

    function fail(message) {
      var state = document.getElementById('state');
      state.textContent = message;
      state.hidden = false;
    }

    function load() {
      var params = new URLSearchParams(location.search);
      var inline = params.get('d');
      var id = params.get('id');

      if (inline) {
        try { return render(decodeInline(inline)); }
        catch (e) { return fail('Khong doc duoc du lieu phieu chi dan.'); }
      }

      if (id) {
        if (!API_BASE) return fail('Chua cau hinh API_BASE cho che do ?id=.');
        return fetch(API_BASE + '/api/guide/' + encodeURIComponent(id))
          .then(function (r) {
            if (!r.ok) throw new Error(String(r.status));
            return r.json();
          })
          .then(render)
          .catch(function () { fail('Khong tai duoc phieu chi dan. Vui long thu lai.'); });
      }

      render(DEMO);
    }

    document.getElementById('btn-save').addEventListener('click', function () {
      window.print();
    });

    document.getElementById('btn-ack').addEventListener('click', function (event) {
      var button = event.currentTarget;
      var id = new URLSearchParams(location.search).get('id');

      button.disabled = true;
      button.textContent = 'Da xac nhan ✓';

      if (!API_BASE || !id) return;

      fetch(API_BASE + '/api/guide/' + encodeURIComponent(id) + '/ack', { method: 'POST' })
        .catch(function () {
          button.disabled = false;
          button.textContent = 'Da xac nhan';
        });
    });

    load();
  </script>
</body>
</html>
